/text><rect x="448" y="368" width="396" height="128" rx="10" fill="#FFFFFF" stroke="#C3D0E3"/><text x="468" y="400" class="s" font-size="16" font-weight="600" fill="#0B1220">PC lab control</text><text x="824" y="400" text-anchor="end" class="m" font-size="10.5" fill="#0E8FA0">LAN · IN PRODUCTION</text><text x="468" y="426" class="s" font-size="13" font-weight="400" fill="#4A5B75">Threat-modeled kiosk lock, fail-closed</text><text x="468" y="446" class="s" font-size="13" font-weight="400" fill="#4A5B75">agent, Win32 interop, append-only clock.</text><line x1="468" y1="464" x2="824" y2="464" stroke="#C3D0E3" stroke-dasharray="2 4"/><text x="468" y="483" class="m" font-size="11" fill="#8394AE">.NET 10 · Avalonia</text><rect x="36" y="512" width="396" height="128" rx="10" fill="#FFFFFF" stroke="#C3D0E3"/><text x="56" y="544" class="s" font-size="16" font-weight="600" fill="#0B1220">Logistics ops</text><text x="412" y="544" text-anchor="end" class="m" font-size="10.5" fill="#0E8FA0">OFFLINE-FIRST</text><text x="56" y="570" class="s" font-size="13" font-weight="400" fill="#4A5B75">Mobile outbox, event-sourced trip status,</text><text x="56" y="590" class="s" font-size="13" font-weight="400" fill="#4A5B75">conflicts kept, never dropped.</text><line x1="56" y1="608" x2="412" y2="608" stroke="#C3D0E3" stroke-dasharray="2 4"/><text x="56" y="627" class="m" font-size="11" fill="#8394AE">Expo · NestJS</text><rect x="448" y="512" width="396" height="128" rx="10" fill="#FFFFFF" stroke="#C3D0E3"/><text x="468" y="544" class="s" font-size="16" font-weight="600" fill="#0B1220">ERP for retail chain</text><text x="824" y="544" text-anchor="end" class="m" font-size="10.5" fill="#0E8FA0">MULTI-BRANCH</text><text x="468" y="570" class="s" font-size="13" font-weight="400" fill="#4A5B75">Branch-scoped access against BOLA,</text><text x="468" y="590" class="s" font-size="13" font-weight="400" fill="#4A5B75">e-invoicing, face-recognition attendance.</text><line x1="468" y1="608" x2="824" y2=