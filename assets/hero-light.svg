="44" y="182" class="s" font-size="24" font-weight="700" text-anchor="start" fill="url(#role)" letter-spacing="-0.4">Senior Software Engineer &amp; Architect</text><text x="44" y="222" class="s" font-size="16" font-weight="400" text-anchor="start" fill="#59636e" >I build products end to end — from the</text><text x="44" y="247" class="s" font-size="16" font-weight="400" text-anchor="start" fill="#59636e" >client's real problem to architecture,</text><text x="44" y="272" class="s" font-size="16" font-weight="400" text-anchor="start" fill="#59636e" >code, cloud and launch.</text><text x="44" y="336" class="s" font-size="28" font-weight="800" text-anchor="start" fill="#8250df" letter-spacing="-1">7+</text><text x="44" y="358" class="s" font-size="12.5" font-weight="400" text-anchor="start" fill="#818b98" >years shipping</text><text x="176" y="336" class="s" font-size="28" font-weight="800" text-anchor="start" fill="#bf3989" letter-spacing="-1">15+</text><text x="176" y="358" class="s" font-size="12.5" font-weight="400" text-anchor="start" fill="#818b98" >products built</text><text x="308" y="336" class="s" font-size="28" font-weight="800" text-anchor="start" fill="#bc4c00" letter-spacing="-1">3</text><text x="308" y="358" class="s" font-size="12.5" font-weight="400" text-anchor="start" fill="#818b98" >open-source projects</text><rect x="492.5" y="66.5" width="349" height="261" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/><path d="M492.5 108V72a5.5 5.5 0 0 1 5.5-5.5h338a5.5 5.5 0 0 1 5.5 5.5V108z" fill="#eff2f5"/><circle cx="514" cy="88" r="5.5" fill="#FF5F57"/><circle cx="532" cy="88" r="5.5" fill="#FEBC2E"/><circle cx="550" cy="88" r="5.5" fill="#28C840"/><text x="667.0" y="92" class="m" font-size="11.5" font-weight="400" text-anchor="middle" fill="#59636e" >~/products — zsh</text><line x1="492" y1="108" x2="842" y2="108" stroke="#d1d9e0"/><text x="510" y="136" class="m" font-size="11.5" font-weight="400" text-anchor="start" fill="#818b98" >1</text><clipPath id="ln0"><rect