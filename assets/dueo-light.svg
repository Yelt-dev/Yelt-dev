<rect width="430" height="236" rx="14" fill="#F7F9FC"/><rect x="1" y="1" width="428" height="234" rx="13" fill="url(#g2)" stroke="#C3D0E3"/><circle cx="34" cy="38" r="5" fill="#0E8FA0"/><text x="48" y="43" class="m" font-size="13" font-weight="700" letter-spacing="2.5" fill="#0B1220">DUEO</text><text x="402" y="43" text-anchor="end" class="m" font-size="11" fill="#8394AE">open source ↗</text><text x="28" y="84" class="s" font-size="19" font-weight="600" fill="#0B1220">Subscriptions, as progress rings.</text><text x="28" y="114" class="s" font-size="13.5" font-weight="400" fill="#4A5B75">Self-hosted tracker with reminders on web,</text><text x="28" y="135" class="s" font-size="13.5" font-weight="400" fill="#4A5B75">Telegram and email. Multi-user, ships as</text><text x="28" y="156" class="s" font-size="13.5" font-weight="400" fill="#4A5B75">a single binary with the UI embedded.</text><rect x="28" y="186" width="45.6" height="24" rx="12" fill="none" stroke="#0E8FA0" stroke-opacity=".6"/><text x="50.8" y="202" text-anchor="middle" class="m" font-size="11" fill="#0E8FA0">Rust</text><rect x="81.6" y="186" width="45.6" height="24" rx="12" fill="none" stroke="#0E8FA0" stroke-opacity=".6"/><text x="104.39999999999999" y="202" text-anchor="middle" class="m" font-size="11" fill="#0E8FA0">Axum</text><rect x="135.2" y="186" width="60.400000000000006" height="24" rx="12" fill="none" stroke="#0E8FA0" stroke-opacity=".6"/><text x="165.39999999999998" y="202" text-anchor="middle" class="m" font-size="11" fill="#0E8FA0">SQLite</text><rect x="203.6" y="186" width="75.2" height="24" rx="12" fill="none" stroke="#0E8FA0" stroke-opacity=".6"/><text x="241.2" y="202" text-anchor="middle" class="m" font-size="11" fill="#0E8FA0">Svelte 5</text><rect x="286.8" y="186" width="38.2" height="24" rx="12" fill="none" stroke="#0E8FA0" stroke-opacity=".6"/><text x="305.90000000000003" y="202" text-anchor="middle" class="m" font-size="11" fill="#0E8FA0">SSE</text>
