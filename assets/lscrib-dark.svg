<rect width="430" height="236" rx="14" fill="#0B1220"/><rect x="1" y="1" width="428" height="234" rx="13" fill="url(#g2)" stroke="#24385A"/><circle cx="34" cy="38" r="5" fill="#00C2D1"/><text x="48" y="43" class="m" font-size="13" font-weight="700" letter-spacing="2.5" fill="#E6EDF7">LSCRIB</text><text x="402" y="43" text-anchor="end" class="m" font-size="11" fill="#5B6E8C">open source ↗</text><text x="28" y="84" class="s" font-size="19" font-weight="600" fill="#E6EDF7">Transcription that stays local.</text><text x="28" y="114" class="s" font-size="13.5" font-weight="400" fill="#8A9BB5">Drop audio or video, get an editable</text><text x="28" y="135" class="s" font-size="13.5" font-weight="400" fill="#8A9BB5">transcript + SRT/VTT/TXT/MD. Whisper runs</text><text x="28" y="156" class="s" font-size="13.5" font-weight="400" fill="#8A9BB5">on your machine — no cloud, no account.</text><rect x="28" y="186" width="60.400000000000006" height="24" rx="12" fill="none" stroke="#00C2D1" stroke-opacity=".6"/><text x="58.2" y="202" text-anchor="middle" class="m" font-size="11" fill="#00C2D1">Python</text><rect x="96.4" y="186" width="67.80000000000001" height="24" rx="12" fill="none" stroke="#00C2D1" stroke-opacity=".6"/><text x="130.3" y="202" text-anchor="middle" class="m" font-size="11" fill="#00C2D1">FastAPI</text><rect x="172.20000000000002" y="186" width="119.60000000000001" height="24" rx="12" fill="none" stroke="#00C2D1" stroke-opacity=".6"/><text x="232.00000000000003" y="202" text-anchor="middle" class="m" font-size="11" fill="#00C2D1">faster-whisper</text><rect x="299.8" y="186" width="53.0" height="24" rx="12" fill="none" stroke="#00C2D1" stroke-opacity=".6"/><text x="326.3" y="202" text-anchor="middle" class="m" font-size="11" fill="#00C2D1">React</text>
