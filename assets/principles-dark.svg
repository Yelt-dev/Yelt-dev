<svg xmlns="http://www.w3.org/2000/svg" width="880" height="496" viewBox="0 0 880 496" fill="none" role="img"><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion: reduce){ *{animation:none!important} }</style><defs><radialGradient id="pg0" cx="1" cy="0" r="1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".14"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient><radialGradient id="pg1" cx="1" cy="0" r="1"><stop offset="0" stop-color="#F472B6" stop-opacity=".14"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></radialGradient><radialGradient id="pg2" cx="1" cy="0" r="1"><stop offset="0" stop-color="#FB923C" stop-opacity=".14"/><stop offset="1" stop-color="#FB923C" stop-opacity="0"/></radialGradient><radialGradient id="pg3" cx="1" cy="0" r="1"><stop offset="0" stop-color="#38BDF8" stop-opacity=".14"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient><radialGradient id="pg4" cx="1" cy="0" r="1"><stop offset="0" stop-color="#34D399" stop-opacity=".14"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient><radialGradient id="pg5" cx="1" cy="0" r="1"><stop offset="0" stop-color="#FBBF24" stop-opacity=".14"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></radialGradient></defs><text x="0" y="30" class="m" font-size="13" font-weight="700" text-anchor="start" fill="#A78BFA" >02</text><text x="30" y="30" class="s" font-size="22" font-weight="700" text-anchor="start" fill="#FAFAFA" letter-spacing="-0.4">Principles</text><text x="880" y="30" class="s" font-size="13" font-weight="400" text-anchor="end" fill="#6B6B75" >how I make decisions</text><rect x="0.5" y="56.5" width="431" height="135" rx="18" fill="#111114" stroke="#26262D"/><rect x="1" y="57" width="430" height="134" rx="17" fill="url(#pg0)"/><rect x="22" y="78" width="44" height="44" rx="12" fill="#A78BFA" fill-opacity=".14"/><ellipse cx="44" cy="93" rx="10" ry="4" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M34 93v14c0 2.2 4.5 4 10 4s10-1.8 10-4v-14M34 100c0 2.2 4.5 4 10 4s10-1.8 10-4" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="84" y="98" class="s" font-size="16.5" font-weight="700" text-anchor="start" fill="#FAFAFA" letter-spacing="-0.2">Make invalid states impossible</text><text x="84" y="122" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#A1A1AA" >Rules live where they can't be</text><text x="84" y="142" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#A1A1AA" >bypassed: constraints, state</text><text x="84" y="162" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#A1A1AA" >machines, server-side pricing.</text><rect x="448.5" y="56.5" width="431" height="135" rx="18" fill="#111114" stroke="#26262D"/><rect x="449" y="57" width="430" height="134" rx="17" fill="url(#pg1)"/><rect x="470" y="78" width="44" height="44" rx="12" fill="#F472B6" fill-opacity=".14"/><circle cx="492" cy="100" r="10" stroke="#F472B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="492" cy="100" r="5" stroke="#F472B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="492" cy="100" r="1.2" fill="#F472B6"/><text x="532" y="98" class="s" font-size="16.5" font-weight="700" text-anchor="start" fill="#FAFAFA" letter-spacing="-0.2">Kill the riskiest assumption first</text><text x="532" y="122" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#A1A1AA" >Spike what can sink the project</text><text x="532" y="142" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#A1A1AA" >before any UI. Phase 0 proves it;</text><text x="532" y="162" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#A1A1AA" >panels come last.</text><rect x="0.5" y="208.5" width="431" height="135" rx="18" fill="#111114" stroke="#26262D"/><rect x="1" y="209" width="430" height="134" rx="17" fill="url(#pg2)"/><rect x="22" y="230" width="44" height="44" rx="12" fill="#FB923C" fill-opacity=".14"/><path d="M33 247v-6h6M55 247v-6h-6M33 257v6h6M55 257v6h-6" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="40" y="248" width="8" height="8" rx="2" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="84" y="250" class="s" font-size="16.5" font-weight="700" text-anchor="start" fill="#FAFAFA" letter-spacing="-0.2">Constraints choose the stack</text><text x="84" y="274" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#A1A1AA" >Shared hosting, LAN-only, Win32</text><text x="84" y="294" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#A1A1AA" >interop — the hard constraint</text><text x="84" y="314" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#A1A1AA" >picks the tools, not the hype.</text><rect x="448.5" y="208.5" width="431" height="135" rx="18" fill="#111114" stroke="#26262D"/><rect x="449" y="209" width="430" height="134" rx="17" fill="url(#pg3)"/><rect x="470" y="230" width="44" height="44" rx="12" fill="#38BDF8" fill-opacity=".14"/><circle cx="490" cy="250" r="7.5" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M495.5 255.5l6 6M487 250h6" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="532" y="250" class="s" font-size="16.5" font-weight="700" text-anchor="start" fill="#FAFAFA" letter-spacing="-0.2">Audit against the code</text><text x="532" y="274" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#A1A1AA" >Docs drift. I verify specs against</text><text x="532" y="294" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#A1A1AA" >the code and pin every rule with</text><text x="532" y="314" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#A1A1AA" >a regression test.</text><rect x="0.5" y="360.5" width="431" height="135" rx="18" fill="#111114" stroke="#26262D"/><rect x="1" y="361" width="430" height="134" rx="17" fill="url(#pg4)"/><rect x="22" y="382" width="44" height="44" rx="12" fill="#34D399" fill-opacity=".14"/><circle cx="44" cy="404" r="10.5" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M47.5 400a4.5 4.5 0 1 0 0 8M44 396v16" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="84" y="402" class="s" font-size="16.5" font-weight="700" text-anchor="start" fill="#FAFAFA" letter-spacing="-0.2">Money is never a float</text><text x="84" y="426" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#A1A1AA" >Integer cents, price snapshots</text><text x="84" y="446" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#A1A1AA" >and idempotency keys. A retry</text><text x="84" y="466" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#A1A1AA" >never charges twice.</text><rect x="448.5" y="360.5" width="431" height="135" rx="18" fill="#111114" stroke="#26262D"/><rect x="449" y="361" width="430" height="134" rx="17" fill="url(#pg5)"/><rect x="470" y="382" width="44" height="44" rx="12" fill="#FBBF24" fill-opacity=".14"/><path d="M492 393l2.6 7.4 7.4 2.6-7.4 2.6-2.6 7.4-2.6-7.4-7.4-2.6 7.4-2.6z" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="532" y="402" class="s" font-size="16.5" font-weight="700" text-anchor="start" fill="#FAFAFA" letter-spacing="-0.2">Every incident leaves a lesson</text><text x="532" y="426" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#A1A1AA" >Root cause, timeline, prevention</text><text x="532" y="446" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#A1A1AA" >— written down, not remembered.</text></svg>