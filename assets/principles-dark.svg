<svg xmlns="http://www.w3.org/2000/svg" width="880" height="506" viewBox="0 0 880 506" role="img">
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}

@media (prefers-reduced-motion: reduce){ .anim{animation:none!important} .pk{display:none} }
</style>
<defs>
<pattern id="g1" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#132036" stroke-width="1"/></pattern>
<pattern id="g2" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#g1)"/><path d="M100 0H0V100" fill="none" stroke="#1A2B47" stroke-width="1"/></pattern>
</defs>
<rect width="880" height="506" rx="14" fill="#0B1220"/>
<rect x="1" y="1" width="878" height="504" rx="13" fill="url(#g2)" stroke="#24385A"/>
<text x="36" y="44" class="m" font-size="12" letter-spacing="2" fill="#00C2D1">SHEET 02</text><text x="112" y="44" class="m" font-size="12" letter-spacing="2" fill="#5B6E8C">/</text><text x="128" y="44" class="m" font-size="12" letter-spacing="2" fill="#E6EDF7">PRINCIPLES</text><text x="844" y="44" text-anchor="end" class="m" font-size="11" fill="#5B6E8C">how I make decisions</text><line x1="36" y1="58" x2="844" y2="58" stroke="#24385A" stroke-dasharray="2 4"/><rect x="36" y="80" width="396" height="118" rx="10" fill="#0F192C" stroke="#24385A"/><circle cx="76" cy="122" r="21" fill="#0B1220" stroke="#00C2D1" stroke-width="1.3"/><line x1="55" y1="122" x2="97" y2="122" stroke="#00C2D1" stroke-width="1.3"/><text x="76" y="116" text-anchor="middle" class="m" font-size="11" font-weight="700" fill="#E6EDF7">01</text><text x="76" y="136" text-anchor="middle" class="m" font-size="9" fill="#5B6E8C">S-02</text><line x1="76" y1="143" x2="76" y2="180" stroke="#24385A" stroke-dasharray="2 3"/><text x="114" y="118" class="s" font-size="16" font-weight="600" fill="#E6EDF7">Let the database enforce it</text><text x="114" y="142" class="s" font-size="13.5" font-weight="400" fill="#8A9BB5">Row-Level Security with FORCE,</text><text x="114" y="162" class="s" font-size="13.5" font-weight="400" fill="#8A9BB5">serializable bookings, advisory locks,</text><text x="114" y="182" class="s" font-size="13.5" font-weight="400" fill="#8A9BB5">prices computed in SQL.</text><rect x="448" y="80" width="396" height="118" rx="10" fill="#0F192C" stroke="#24385A"/><circle cx="488" cy="122" r="21" fill="#0B1220" stroke="#00C2D1" stroke-width="1.3"/><line x1="467" y1="122" x2="509" y2="122" stroke="#00C2D1" stroke-width="1.3"/><text x="488" y="116" text-anchor="middle" class="m" font-size="11" font-weight="700" fill="#E6EDF7">02</text><text x="488" y="136" text-anchor="middle" class="m" font-size="9" fill="#5B6E8C">S-02</text><line x1="488" y1="143" x2="488" y2="180" stroke="#24385A" stroke-dasharray="2 3"/><text x="526" y="118" class="s" font-size="16" font-weight="600" fill="#E6EDF7">Kill the riskiest assumption first</text><text x="526" y="142" class="s" font-size="13.5" font-weight="400" fill="#8A9BB5">Spike what can sink the project</text><text x="526" y="162" class="s" font-size="13.5" font-weight="400" fill="#8A9BB5">before any UI. Phase 0 proves it;</text><text x="526" y="182" class="s" font-size="13.5" font-weight="400" fill="#8A9BB5">panels come last.</text><rect x="36" y="214" width="396" height="118" rx="10" fill="#0F192C" stroke="#24385A"/><circle cx="76" cy="256" r="21" fill="#0B1220" stroke="#00C2D1" stroke-width="1.3"/><line x1="55" y1="256" x2="97" y2="256" stroke="#00C2D1" stroke-width="1.3"/><text x="76" y="250" text-anchor="middle" class="m" font-size="11" font-weight="700" fill="#E6EDF7">03</text><text x="76" y="270" text-anchor="middle" class="m" font-size="9" fill="#5B6E8C">S-02</text><line x1="76" y1="277" x2="76" y2="314" stroke="#24385A" stroke-dasharray="2 3"/><text x="114" y="252" class="s" font-size="16" font-weight="600" fill="#E6EDF7">Constraints choose the stack</text><text x="114" y="276" class="s" font-size="13.5" font-weight="400" fill="#8A9BB5">Shared hosting, LAN-only, Win32</text><text x="114" y="296" class="s" font-size="13.5" font-weight="400" fill="#8A9BB5">interop — the hard constraint picks</text><text x="114" y="316" class="s" font-size="13.5" font-weight="400" fill="#8A9BB5">the tools, not the hype.</text><rect x="448" y="214" width="396" height="118" rx="10" fill="#0F192C" stroke="#24385A"/><circle cx="488" cy="256" r="21" fill="#0B1220" stroke="#00C2D1" stroke-width="1.3"/><line x1="467" y1="256" x2="509" y2="256" stroke="#00C2D1" stroke-width="1.3"/><text x="488" y="250" text-anchor="middle" class="m" font-size="11" font-weight="700" fill="#E6EDF7">04</text><text x="488" y="270" text-anchor="middle" class="m" font-size="9" fill="#5B6E8C">S-02</text><line x1="488" y1="277" x2="488" y2="314" stroke="#24385A" stroke-dasharray="2 3"/><text x="526" y="252" class="s" font-size="16" font-weight="600" fill="#E6EDF7">Audit against the code</text><text x="526" y="276" class="s" font-size="13.5" font-weight="400" fill="#8A9BB5">Docs drift. I verify specs against</text><text x="526" y="296" class="s" font-size="13.5" font-weight="400" fill="#8A9BB5">the code and pin every rule with a</text><text x="526" y="316" class="s" font-size="13.5" font-weight="400" fill="#8A9BB5">regression test.</text><rect x="36" y="348" width="396" height="118" rx="10" fill="#0F192C" stroke="#24385A"/><circle cx="76" cy="390" r="21" fill="#0B1220" stroke="#00C2D1" stroke-width="1.3"/><line x1="55" y1="390" x2="97" y2="390" stroke="#00C2D1" stroke-width="1.3"/><text x="76" y="384" text-anchor="middle" class="m" font-size="11" font-weight="700" fill="#E6EDF7">05</text><text x="76" y="404" text-anchor="middle" class="m" font-size="9" fill="#5B6E8C">S-02</text><line x1="76" y1="411" x2="76" y2="448" stroke="#24385A" stroke-dasharray="2 3"/><text x="114" y="386" class="s" font-size="16" font-weight="600" fill="#E6EDF7">Money is never a float</text><text x="114" y="410" class="s" font-size="13.5" font-weight="400" fill="#8A9BB5">Integer cents, price snapshots and</text><text x="114" y="430" class="s" font-size="13.5" font-weight="400" fill="#8A9BB5">idempotency keys. A retry never</text><text x="114" y="450" class="s" font-size="13.5" font-weight="400" fill="#8A9BB5">charges twice.</text><rect x="448" y="348" width="396" height="118" rx="10" fill="#0F192C" stroke="#24385A"/><circle cx="488" cy="390" r="21" fill="#0B1220" stroke="#00C2D1" stroke-width="1.3"/><line x1="467" y1="390" x2="509" y2="390" stroke="#00C2D1" stroke-width="1.3"/><text x="488" y="384" text-anchor="middle" class="m" font-size="11" font-weight="700" fill="#E6EDF7">06</text><text x="488" y="404" text-anchor="middle" class="m" font-size="9" fill="#5B6E8C">S-02</text><line x1="488" y1="411" x2="488" y2="448" stroke="#24385A" stroke-dasharray="2 3"/><text x="526" y="386" class="s" font-size="16" font-weight="600" fill="#E6EDF7">Every incident leaves a lesson</text><text x="526" y="410" class="s" font-size="13.5" font-weight="400" fill="#8A9BB5">Root cause, timeline, prevention —</text><text x="526" y="430" class="s" font-size="13.5" font-weight="400" fill="#8A9BB5">written down, not remembered.</text>
</svg>