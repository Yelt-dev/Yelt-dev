<svg xmlns="http://www.w3.org/2000/svg" width="880" height="800" viewBox="0 0 880 800" fill="none" role="img"><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion: reduce){ *{animation:none!important} }</style><defs><radialGradient id="pg0" cx="1" cy="0" r="1"><stop offset="0" stop-color="#8250df" stop-opacity=".07"/><stop offset="1" stop-color="#8250df" stop-opacity="0"/></radialGradient><radialGradient id="pg1" cx="1" cy="0" r="1"><stop offset="0" stop-color="#bf3989" stop-opacity=".07"/><stop offset="1" stop-color="#bf3989" stop-opacity="0"/></radialGradient><radialGradient id="pg2" cx="1" cy="0" r="1"><stop offset="0" stop-color="#bc4c00" stop-opacity=".07"/><stop offset="1" stop-color="#bc4c00" stop-opacity="0"/></radialGradient><radialGradient id="pg3" cx="1" cy="0" r="1"><stop offset="0" stop-color="#0969da" stop-opacity=".07"/><stop offset="1" stop-color="#0969da" stop-opacity="0"/></radialGradient><radialGradient id="pg4" cx="1" cy="0" r="1"><stop offset="0" stop-color="#1a7f37" stop-opacity=".07"/><stop offset="1" stop-color="#1a7f37" stop-opacity="0"/></radialGradient><radialGradient id="pg5" cx="1" cy="0" r="1"><stop offset="0" stop-color="#9a6700" stop-opacity=".07"/><stop offset="1" stop-color="#9a6700" stop-opacity="0"/></radialGradient><radialGradient id="pg6" cx="1" cy="0" r="1"><stop offset="0" stop-color="#0969da" stop-opacity=".07"/><stop offset="1" stop-color="#0969da" stop-opacity="0"/></radialGradient><radialGradient id="pg7" cx="1" cy="0" r="1"><stop offset="0" stop-color="#8250df" stop-opacity=".07"/><stop offset="1" stop-color="#8250df" stop-opacity="0"/></radialGradient><radialGradient id="pg8" cx="1" cy="0" r="1"><stop offset="0" stop-color="#1a7f37" stop-opacity=".07"/><stop offset="1" stop-color="#1a7f37" stop-opacity="0"/></radialGradient><radialGradient id="pg9" cx="1" cy="0" r="1"><stop offset="0" stop-color="#bc4c00" stop-opacity=".07"/><stop offset="1" stop-color="#bc4c00" stop-opacity="0"/></radialGradient></defs><text x="0" y="30" class="m" font-size="13" font-weight="700" text-anchor="start" fill="#8250df" >02</text><text x="30" y="30" class="s" font-size="22" font-weight="700" text-anchor="start" fill="#1f2328" letter-spacing="-0.4">Principles</text><text x="880" y="30" class="s" font-size="13" font-weight="400" text-anchor="end" fill="#818b98" >how I make decisions</text><rect x="0.5" y="56.5" width="431" height="135" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="1" y="57" width="430" height="134" rx="5" fill="url(#pg0)"/><rect x="22" y="78" width="44" height="44" rx="6" fill="#8250df" fill-opacity=".12"/><ellipse cx="44" cy="93" rx="10" ry="4" stroke="#8250df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M34 93v14c0 2.2 4.5 4 10 4s10-1.8 10-4v-14M34 100c0 2.2 4.5 4 10 4s10-1.8 10-4" stroke="#8250df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="84" y="98" class="s" font-size="16.5" font-weight="700" text-anchor="start" fill="#1f2328" letter-spacing="-0.2">Make invalid states impossible</text><text x="84" y="122" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >Rules live where they can't be</text><text x="84" y="142" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >bypassed: constraints, state</text><text x="84" y="162" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >machines, server-side pricing.</text><rect x="448.5" y="56.5" width="431" height="135" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="449" y="57" width="430" height="134" rx="5" fill="url(#pg1)"/><rect x="470" y="78" width="44" height="44" rx="6" fill="#bf3989" fill-opacity=".12"/><circle cx="492" cy="100" r="10" stroke="#bf3989" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="492" cy="100" r="5" stroke="#bf3989" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="492" cy="100" r="1.2" fill="#bf3989"/><text x="532" y="98" class="s" font-size="16.5" font-weight="700" text-anchor="start" fill="#1f2328" letter-spacing="-0.2">Kill the riskiest assumption first</text><text x="532" y="122" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >Spike what can sink the project</text><text x="532" y="142" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >before any UI. Phase 0 proves it;</text><text x="532" y="162" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >panels come last.</text><rect x="0.5" y="208.5" width="431" height="135" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="1" y="209" width="430" height="134" rx="5" fill="url(#pg2)"/><rect x="22" y="230" width="44" height="44" rx="6" fill="#bc4c00" fill-opacity=".12"/><path d="M33 247v-6h6M55 247v-6h-6M33 257v6h6M55 257v6h-6" stroke="#bc4c00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="40" y="248" width="8" height="8" rx="2" stroke="#bc4c00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="84" y="250" class="s" font-size="16.5" font-weight="700" text-anchor="start" fill="#1f2328" letter-spacing="-0.2">Constraints choose the stack</text><text x="84" y="274" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >Shared hosting, LAN-only, Win32</text><text x="84" y="294" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >interop — the hard constraint</text><text x="84" y="314" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >picks the tools, not the hype.</text><rect x="448.5" y="208.5" width="431" height="135" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="449" y="209" width="430" height="134" rx="5" fill="url(#pg3)"/><rect x="470" y="230" width="44" height="44" rx="6" fill="#0969da" fill-opacity=".12"/><circle cx="490" cy="250" r="7.5" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M495.5 255.5l6 6M487 250h6" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="532" y="250" class="s" font-size="16.5" font-weight="700" text-anchor="start" fill="#1f2328" letter-spacing="-0.2">Audit against the code</text><text x="532" y="274" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >Docs drift. I verify specs against</text><text x="532" y="294" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >the code and pin every rule with</text><text x="532" y="314" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >a regression test.</text><rect x="0.5" y="360.5" width="431" height="135" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="1" y="361" width="430" height="134" rx="5" fill="url(#pg4)"/><rect x="22" y="382" width="44" height="44" rx="6" fill="#1a7f37" fill-opacity=".12"/><circle cx="44" cy="404" r="10.5" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M47.5 400a4.5 4.5 0 1 0 0 8M44 396v16" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="84" y="402" class="s" font-size="16.5" font-weight="700" text-anchor="start" fill="#1f2328" letter-spacing="-0.2">Every cent adds up</text><text x="84" y="426" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >Amounts in integer cents. Each sale</text><text x="84" y="446" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >keeps the price it was sold at; a</text><text x="84" y="466" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >retried payment never charges twice.</text><rect x="448.5" y="360.5" width="431" height="135" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="449" y="361" width="430" height="134" rx="5" fill="url(#pg5)"/><rect x="470" y="382" width="44" height="44" rx="6" fill="#9a6700" fill-opacity=".12"/><path d="M492 393l2.6 7.4 7.4 2.6-7.4 2.6-2.6 7.4-2.6-7.4-7.4-2.6 7.4-2.6z" stroke="#9a6700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="532" y="402" class="s" font-size="16.5" font-weight="700" text-anchor="start" fill="#1f2328" letter-spacing="-0.2">Every incident leaves a lesson</text><text x="532" y="426" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >Root cause, timeline, prevention</text><text x="532" y="446" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >— written down, not remembered.</text><rect x="0.5" y="512.5" width="431" height="135" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="1" y="513" width="430" height="134" rx="5" fill="url(#pg6)"/><rect x="22" y="534" width="44" height="44" rx="6" fill="#0969da" fill-opacity=".12"/><circle cx="44" cy="551" r="4.5" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M35 566c1-5 4.5-7.5 9-7.5s8 2.5 9 7.5" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="84" y="554" class="s" font-size="16.5" font-weight="700" text-anchor="start" fill="#1f2328" letter-spacing="-0.2">Start from the real problem</text><text x="84" y="578" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >Understand what hurts, what already</text><text x="84" y="598" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >exists and what isn't worth building</text><text x="84" y="618" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >— before writing a line of code.</text><rect x="448.5" y="512.5" width="431" height="135" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="449" y="513" width="430" height="134" rx="5" fill="url(#pg7)"/><rect x="470" y="534" width="44" height="44" rx="6" fill="#8250df" fill-opacity=".12"/><path d="M492 546l11 5.5-11 5.5-11-5.5z" stroke="#8250df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M481 557l11 5.5 11-5.5M481 562.5l11 5.5 11-5.5" stroke="#8250df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="532" y="554" class="s" font-size="16.5" font-weight="700" text-anchor="start" fill="#1f2328" letter-spacing="-0.2">Fewer parts, fewer failures</text><text x="532" y="578" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >The simplest thing that works wins:</text><text x="532" y="598" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >one binary over five services, a</text><text x="532" y="618" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >modular monolith over microservices.</text><rect x="0.5" y="664.5" width="431" height="135" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="1" y="665" width="430" height="134" rx="5" fill="url(#pg8)"/><rect x="22" y="686" width="44" height="44" rx="6" fill="#1a7f37" fill-opacity=".12"/><path d="M44 697l9 3.5v6c0 6-4 10-9 12-5-2-9-6-9-12v-6z" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M40 708l3 3 5.5-6" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="84" y="706" class="s" font-size="16.5" font-weight="700" text-anchor="start" fill="#1f2328" letter-spacing="-0.2">Secure by default</text><text x="84" y="730" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >Fail closed. Hashed tokens, rotating</text><text x="84" y="750" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >sessions, and someone else's data</text><text x="84" y="770" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >answers "not found", not "forbidden".</text><rect x="448.5" y="664.5" width="431" height="135" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="449" y="665" width="430" height="134" rx="5" fill="url(#pg9)"/><rect x="470" y="686" width="44" height="44" rx="6" fill="#bc4c00" fill-opacity=".12"/><path d="M484 697h11l5 5v17h-16z" stroke="#bc4c00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M495 697v5h5M488 709h8M488 714h6" stroke="#bc4c00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="532" y="706" class="s" font-size="16.5" font-weight="700" text-anchor="start" fill="#1f2328" letter-spacing="-0.2">Decide in writing</text><text x="532" y="730" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >Every key decision leaves a record:</text><text x="532" y="750" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >context, alternatives, and why</text><text x="532" y="770" class="s" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" >the others were rejected.</text></svg>