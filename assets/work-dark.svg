/text><rect x="448" y="368" width="396" height="128" rx="10" fill="#0F192C" stroke="#24385A"/><text x="468" y="400" class="s" font-size="16" font-weight="600" fill="#E6EDF7">PC lab control</text><text x="824" y="400" text-anchor="end" class="m" font-size="10.5" fill="#00C2D1">LAN · IN PRODUCTION</text><text x="468" y="426" class="s" font-size="13" font-weight="400" fill="#8A9BB5">Threat-modeled kiosk lock, fail-closed</text><text x="468" y="446" class="s" font-size="13" font-weight="400" fill="#8A9BB5">agent, Win32 interop, append-only clock.</text><line x1="468" y1="464" x2="824" y2="464" stroke="#24385A" stroke-dasharray="2 4"/><text x="468" y="483" class="m" font-size="11" fill="#5B6E8C">.NET 10 · Avalonia</text><rect x="36" y="512" width="396" height="128" rx="10" fill="#0F192C" stroke="#24385A"/><text x="56" y="544" class="s" font-size="16" font-weight="600" fill="#E6EDF7">Logistics ops</text><text x="412" y="544" text-anchor="end" class="m" font-size="10.5" fill="#00C2D1">OFFLINE-FIRST</text><text x="56" y="570" class="s" font-size="13" font-weight="400" fill="#8A9BB5">Mobile outbox, event-sourced trip status,</text><text x="56" y="590" class="s" font-size="13" font-weight="400" fill="#8A9BB5">conflicts kept, never dropped.</text><line x1="56" y1="608" x2="412" y2="608" stroke="#24385A" stroke-dasharray="2 4"/><text x="56" y="627" class="m" font-size="11" fill="#5B6E8C">Expo · NestJS</text><rect x="448" y="512" width="396" height="128" rx="10" fill="#0F192C" stroke="#24385A"/><text x="468" y="544" class="s" font-size="16" font-weight="600" fill="#E6EDF7">ERP for retail chain</text><text x="824" y="544" text-anchor="end" class="m" font-size="10.5" fill="#00C2D1">MULTI-BRANCH</text><text x="468" y="570" class="s" font-size="13" font-weight="400" fill="#8A9BB5">Branch-scoped access against BOLA,</text><text x="468" y="590" class="s" font-size="13" font-weight="400" fill="#8A9BB5">e-invoicing, face-recognition attendance.</text><line x1="468" y1="608" x2="824" y2=